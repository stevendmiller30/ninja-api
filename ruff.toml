src = ["src"]

exclude = [
    ".vscode",
    ".dev-containers",
    "manage.py",
    "**/tests",
    "uv.lock",
]

target-version = "py314"

line-length = 120
indent-width = 4
respect-gitignore = true
show-fixes = true 

[format]
quote-style = "double"
docstring-code-format = true
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# E4 = import errors
# E7 = Catches bad syntax
# E9 = Runtime/syntax errors
# F = pyflakes
# PL = Pylint
# C901 = McCabe Complexity
# ...["I"] = Isort

[lint]
select = ["E4", "E7", "E9", "F", "PL", "C901"]
extend-select = ["I"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[lint.mccabe]
max-complexity = 9

[lint.isort]
split-on-trailing-comma = false

[lint.pydocstyle]
convention = "google"