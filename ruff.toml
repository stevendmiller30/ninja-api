src = ["src"]

exclude = [
    ".vscode",
    ".dev-containers",
    "manage.py",
    "**/tests",
    "uv.lock",
]

line-length = 120
indent-width = 4
respect-gitignore = true
show-fixes = true

target-version = "py314"

[lint]
select = ["E4", "E7", "E9", "F", "PL", "C901"]
extend-select = ["I"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
quote-style = "double"
docstring-code-format = true
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[lint.mccabe]
max-complexity = 9

[lint.isort]
split-on-trailing-comma = false

[lint.pydocstyle]
convention = "google"