services:
  postgres:
    image: postgres:16-alpine
    platform: linux/amd64
    volumes:
      - base_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: base-db
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-container-env
    platform: linux/amd64
    env_file: docker-compose.env
    ports:
      - "8000:8000"
    volumes:
      - .:/app 
    command:
      [/bin/sleep, infinity]
    depends_on:
      postgres:
        condition: service_healthy
 

 

volumes:
  base_db_data:
 
  